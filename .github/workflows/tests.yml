# Tipos, build, tests unitarios y equilibrio de las barajas en cada pull request y en cada push a main.
# Los E2E de Playwright se añadirán aquí cuando lleguen los de la partida.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unitarios:
    name: Tipos, build y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Usa la versión de pnpm declarada en "packageManager" de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm validar-baraja
